[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sizedur"
version = "0.1.0"
description = "Validating parser and pretty printer for byte sizes and durations"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "lindaw103" }]
keywords = ["bytes", "duration", "parser", "human-readable", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/lindaw103/sizedur-parser"
Repository = "https://github.com/lindaw103/sizedur-parser"
Issues = "https://github.com/lindaw103/sizedur-parser/issues"

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
sizedur = "sizedur.cli:main"

[tool.setuptools.packages.find]
include = ["sizedur*"]
